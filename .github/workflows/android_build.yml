name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: stable

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/controlpan-release.jks

      - name: Crear key.properties
        run: |
          cat > android/key.properties <<EOF2
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=controlpan-release.jks
          EOF2

      - name: Obtener dependencias
        run: flutter pub get

      - name: Analizar proyecto
        run: flutter analyze

      - name: Compilar APK Release
        run: flutter build apk --release --build-number=2

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: controlpan_apk_release
          path: build/app/outputs/flutter-apk/app-release.apk
